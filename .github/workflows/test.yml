name: test

on:
  push:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - 'vite.singlefile.config.ts'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - 'vite.singlefile.config.ts'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx vitest run --reporter=junit --outputFile=junit.xml

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: junit.xml

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, singlefile]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
        if: matrix.variant == 'standard'

      - run: npm run test:e2e:singlefile
        if: matrix.variant == 'singlefile'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.variant }}
          path: ${{ matrix.variant == 'singlefile' && 'playwright-report-singlefile/' || 'playwright-report/' }}
          retention-days: 14

  # Verify LLM feature flag correctly strips SQL/LLM code when disabled
  feature-flag-verification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Build without flag (default) and verify no SQL/LLM code
      - name: Build standard without LLM flag
        run: npm run build

      - name: Verify standard build excludes SQL engine
        run: |
          set -euo pipefail
          echo "Checking for SQLite/wasm SQL engine code in dist/..."
          if grep -r -i -E 'sqlite|sql\.js' dist/ 2>/dev/null; then
            echo "ERROR: Found SQLite/SQL engine references in standard build (VITE_ENABLE_LLM should be off by default)"
            exit 1
          fi
          if grep -r 'sql\.js\.org' dist/ 2>/dev/null; then
            echo "ERROR: Found sql.js CDN references in standard build"
            exit 1
          fi
          if find dist -name '*.wasm' -print -quit | grep -q .; then
            echo "ERROR: Found .wasm assets in standard build"
            find dist -name '*.wasm'
            exit 1
          fi
          echo "✓ No SQLite/SQL engine code found in standard build"

      - name: Verify standard build excludes OpenAI references
        run: |
          set -euo pipefail
          echo "Checking for api.openai.com in dist/..."
          if grep -r 'api\.openai\.com' dist/ 2>/dev/null; then
            echo "ERROR: Found api.openai.com references in standard build"
            exit 1
          fi
          if [ -f dist/THIRD_PARTY_LICENSES.md ]; then
            echo "ERROR: THIRD_PARTY_LICENSES.md present without LLM flag"
            exit 1
          fi
          echo "✓ No OpenAI API references found in standard build"

      # Build singlefile without flag and verify
      - name: Build singlefile without LLM flag
        run: npm run build:singlefile

      - name: Verify singlefile build excludes SQL engine
        run: |
          set -euo pipefail
          echo "Checking for SQLite/wasm SQL engine code in dist-singlefile/..."
          if grep -r -i -E 'sqlite|sql\.js' dist-singlefile/ 2>/dev/null; then
            echo "ERROR: Found SQLite/SQL engine references in singlefile build (VITE_ENABLE_LLM should be off by default)"
            exit 1
          fi
          if grep -r 'sql\.js\.org' dist-singlefile/ 2>/dev/null; then
            echo "ERROR: Found sql.js CDN references in singlefile build"
            exit 1
          fi
          if find dist-singlefile -name '*.wasm' -print -quit | grep -q .; then
            echo "ERROR: Found .wasm assets in singlefile build"
            find dist-singlefile -name '*.wasm'
            exit 1
          fi
          echo "✓ No SQLite/SQL engine code found in singlefile build"

      - name: Verify singlefile build excludes OpenAI references
        run: |
          set -euo pipefail
          echo "Checking for api.openai.com in dist-singlefile/..."
          if grep -r 'api\.openai\.com' dist-singlefile/ 2>/dev/null; then
            echo "ERROR: Found api.openai.com references in singlefile build"
            exit 1
          fi
          if [ -f dist-singlefile/THIRD_PARTY_LICENSES.md ]; then
            echo "ERROR: THIRD_PARTY_LICENSES.md present in singlefile build without LLM flag"
            exit 1
          fi
          echo "✓ No OpenAI API references found in singlefile build"

      # Build with flag and verify SQL code IS included
      - name: Build with LLM flag enabled
        run: VITE_ENABLE_LLM=1 npm run build
        env:
          VITE_ENABLE_LLM: "1"

      - name: Verify LLM build includes SQL engine
        run: |
          set -euo pipefail
          echo "Checking that SQLite/SQL engine code IS present in LLM-enabled build..."
          if ! grep -r -i -E 'sqlite|sql\.js' dist/ 2>/dev/null; then
            echo "ERROR: SQLite/SQL engine code NOT found in LLM-enabled build (expected to be present)"
            exit 1
          fi
          if ! find dist -name '*.wasm' -print -quit | grep -q .; then
            echo "ERROR: No bundled sql-wasm.wasm asset in LLM-enabled build"
            exit 1
          fi
          if [ ! -f dist/THIRD_PARTY_LICENSES.md ]; then
            echo "ERROR: dist/THIRD_PARTY_LICENSES.md missing from LLM-enabled build"
            find dist -type f
            exit 1
          fi
          if grep -r 'sql\.js\.org' dist/ 2>/dev/null; then
            echo "ERROR: LLM build still references sql.js CDN"
            exit 1
          fi
          echo "✓ SQL engine code found in LLM-enabled build as expected"

